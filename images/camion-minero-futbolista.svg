<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5fa8e8"/>
      <stop offset="1" stop-color="#f6d9a8"/>
    </linearGradient>
    <linearGradient id="yellow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd23a"/>
      <stop offset="1" stop-color="#e8a400"/>
    </linearGradient>
    <linearGradient id="bed" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffcf2e"/>
      <stop offset="1" stop-color="#d99500"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bfe6ff"/>
      <stop offset="1" stop-color="#6aa9d6"/>
    </linearGradient>
    <radialGradient id="tire" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0.55" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#151515"/>
    </radialGradient>
    <pattern id="tread" width="24" height="24" patternUnits="userSpaceOnUse">
      <rect width="24" height="24" fill="#1d1d1d"/>
      <rect x="0" y="0" width="10" height="24" fill="#2b2b2b"/>
    </pattern>
  </defs>

  <!-- Cielo -->
  <rect width="1200" height="800" fill="url(#sky)"/>
  <circle cx="1060" cy="110" r="55" fill="#fff4c2"/>
  <circle cx="1060" cy="110" r="42" fill="#ffe680"/>
  <g fill="#ffffff" opacity="0.85">
    <ellipse cx="200" cy="110" rx="80" ry="24"/>
    <ellipse cx="250" cy="95" rx="55" ry="24"/>
    <ellipse cx="700" cy="80" rx="70" ry="20"/>
    <ellipse cx="745" cy="68" rx="45" ry="20"/>
  </g>

  <!-- Rajo abierto (terrazas de la mina) -->
  <path d="M0 330 L120 300 L260 320 L420 290 L600 310 L780 280 L960 305 L1200 285 L1200 640 L0 640 Z" fill="#b8865a"/>
  <path d="M0 380 L1200 360 L1200 640 L0 640 Z" fill="#a9764b"/>
  <path d="M0 430 L1200 415 L1200 640 L0 640 Z" fill="#9a6a41"/>
  <path d="M0 485 L1200 470 L1200 640 L0 640 Z" fill="#8b5d37"/>
  <g stroke="#7a5030" stroke-width="3" opacity="0.6">
    <line x1="0" y1="380" x2="1200" y2="360"/>
    <line x1="0" y1="430" x2="1200" y2="415"/>
    <line x1="0" y1="485" x2="1200" y2="470"/>
  </g>
  <!-- Mini camiones lejanos -->
  <g transform="translate(140 352) scale(0.18)">
    <rect x="0" y="0" width="200" height="70" fill="#e8a400"/>
    <rect x="-60" y="30" width="70" height="50" fill="#e8a400"/>
    <circle cx="20" cy="95" r="30" fill="#222"/><circle cx="170" cy="95" r="30" fill="#222"/>
  </g>
  <g transform="translate(1020 400) scale(0.14)">
    <rect x="0" y="0" width="200" height="70" fill="#e8a400"/>
    <rect x="-60" y="30" width="70" height="50" fill="#e8a400"/>
    <circle cx="20" cy="95" r="30" fill="#222"/><circle cx="170" cy="95" r="30" fill="#222"/>
  </g>

  <!-- Camino -->
  <path d="M0 610 L1200 600 L1200 800 L0 800 Z" fill="#c49a6c"/>
  <path d="M0 610 L1200 600 L1200 618 L0 628 Z" fill="#a98157"/>
  <g fill="#b08960" opacity="0.7">
    <ellipse cx="150" cy="720" rx="40" ry="6"/>
    <ellipse cx="520" cy="760" rx="60" ry="7"/>
    <ellipse cx="980" cy="740" rx="50" ry="6"/>
  </g>

  <!-- Polvo detrás del camión -->
  <g fill="#e2c9a4" opacity="0.75">
    <circle cx="1100" cy="610" r="45"/>
    <circle cx="1150" cy="580" r="35"/>
    <circle cx="1065" cy="575" r="28"/>
    <circle cx="1180" cy="625" r="30"/>
  </g>

  <!-- Sombra del camión -->
  <ellipse cx="660" cy="660" rx="460" ry="28" fill="#000" opacity="0.25"/>

  <!-- ============ CAMIÓN MINERO ============ -->
  <!-- Chasis -->
  <rect x="300" y="455" width="740" height="55" rx="6" fill="#3b3b3b"/>
  <rect x="300" y="455" width="740" height="12" fill="#555"/>

  <!-- Cilindro de volteo -->
  <line x1="640" y1="500" x2="700" y2="420" stroke="#9aa0a6" stroke-width="18" stroke-linecap="round"/>
  <line x1="640" y1="500" x2="670" y2="460" stroke="#c9ced3" stroke-width="10" stroke-linecap="round"/>

  <!-- Tolva -->
  <path d="M560 225 L1075 205 L1060 445 L610 455 Z" fill="url(#bed)" stroke="#a86f00" stroke-width="6" stroke-linejoin="round"/>
  <!-- Refuerzos de la tolva -->
  <g stroke="#b97c00" stroke-width="10">
    <line x1="690" y1="222" x2="705" y2="452"/>
    <line x1="820" y1="217" x2="830" y2="450"/>
    <line x1="950" y1="212" x2="955" y2="447"/>
  </g>
  <!-- Visera (canopy) sobre la cabina -->
  <path d="M330 205 L575 222 L575 252 L338 236 Z" fill="url(#yellow)" stroke="#a86f00" stroke-width="5" stroke-linejoin="round"/>
  <!-- Carga de mineral -->
  <path d="M575 228 Q640 160 720 200 Q790 150 870 195 Q950 145 1065 205 Z" fill="#6b5a4e"/>
  <g fill="#4f4038">
    <circle cx="660" cy="200" r="12"/><circle cx="780" cy="185" r="15"/>
    <circle cx="900" cy="180" r="13"/><circle cx="1000" cy="195" r="10"/>
  </g>
  <g fill="#c58b5a">
    <circle cx="720" cy="205" r="6"/><circle cx="845" cy="198" r="7"/><circle cx="960" cy="190" r="5"/>
  </g>
  <!-- Arco de fútbol sobre la carga -->
  <g stroke="#ffffff" stroke-width="7" fill="none" stroke-linecap="round">
    <path d="M790 192 L795 105 L945 105 L948 186"/>
  </g>
  <g stroke="#ffffff" stroke-width="1.5" opacity="0.8">
    <line x1="810" y1="110" x2="812" y2="190"/><line x1="830" y1="110" x2="831" y2="190"/>
    <line x1="850" y1="110" x2="850" y2="190"/><line x1="870" y1="110" x2="870" y2="190"/>
    <line x1="890" y1="110" x2="890" y2="188"/><line x1="910" y1="110" x2="911" y2="188"/>
    <line x1="930" y1="110" x2="931" y2="187"/>
    <line x1="796" y1="125" x2="946" y2="125"/><line x1="796" y1="145" x2="946" y2="145"/>
    <line x1="796" y1="165" x2="947" y2="165"/>
  </g>
  <!-- Banderín -->
  <line x1="1060" y1="210" x2="1060" y2="120" stroke="#666" stroke-width="4"/>
  <path d="M1060 120 L1105 132 L1060 146 Z" fill="#e53935"/>

  <!-- Cubierta / plataforma delantera -->
  <rect x="295" y="395" width="285" height="22" fill="#e8a400" stroke="#a86f00" stroke-width="4"/>
  <!-- Barandas -->
  <g stroke="#ffcf2e" stroke-width="5">
    <line x1="300" y1="395" x2="300" y2="350"/>
    <line x1="330" y1="395" x2="330" y2="350"/>
    <line x1="296" y1="352" x2="372" y2="352"/>
    <line x1="296" y1="372" x2="372" y2="372"/>
  </g>
