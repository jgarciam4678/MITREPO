  <g stroke="#777" stroke-width="4">
    <line x1="248" y1="540" x2="270" y2="548"/>
    <line x1="256" y1="520" x2="278" y2="528"/>
    <line x1="264" y1="500" x2="286" y2="508"/>
    <line x1="272" y1="480" x2="294" y2="488"/>
    <line x1="280" y1="460" x2="302" y2="468"/>
    <line x1="288" y1="440" x2="310" y2="448"/>
  </g>

  <!-- Frente / radiador -->
  <rect x="300" y="417" width="120" height="95" rx="6" fill="url(#yellow)" stroke="#a86f00" stroke-width="4"/>
  <g stroke="#7a5200" stroke-width="4">
    <line x1="315" y1="430" x2="315" y2="500"/><line x1="335" y1="430" x2="335" y2="500"/>
    <line x1="355" y1="430" x2="355" y2="500"/><line x1="375" y1="430" x2="375" y2="500"/>
    <line x1="395" y1="430" x2="395" y2="500"/>
  </g>
