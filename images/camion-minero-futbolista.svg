  <rect x="370" y="258" width="185" height="137" rx="10" fill="url(#yellow)" stroke="#a86f00" stroke-width="5"/>
  <!-- Ventana -->
  <rect x="385" y="270" width="155" height="88" rx="8" fill="url(#glass)" stroke="#333" stroke-width="4"/>
  <!-- Puerta -->
  <line x1="470" y1="362" x2="470" y2="392" stroke="#a86f00" stroke-width="3"/>
  <rect x="490" y="370" width="22" height="6" rx="3" fill="#555"/>
  <!-- Baliza -->
  <rect x="440" y="244" width="22" height="14" rx="4" fill="#ff8f00"/>
  <circle cx="451" cy="244" r="9" fill="#ffb300"/>

  <!-- ====== JUGADOR DE FÚTBOL (dentro de la cabina) ====== -->
  <clipPath id="win"><rect x="387" y="272" width="151" height="84" rx="7"/></clipPath>
  <g clip-path="url(#win)">
    <!-- Torso: camiseta a rayas -->
    <path d="M430 360 L432 330 Q462 315 492 330 L496 360 Z" fill="#ffffff"/>
    <g fill="#d32f2f">
      <rect x="440" y="320" width="10" height="40"/>
      <rect x="460" y="318" width="10" height="42"/>
      <rect x="480" y="322" width="10" height="38"/>
    </g>
    <!-- Cuello -->
    <path d="M452 322 L462 334 L472 322" fill="none" stroke="#1a1a1a" stroke-width="3"/>
    <!-- Brazalete de capitán -->
    <rect x="426" y="336" width="10" height="10" fill="#ffeb3b" transform="rotate(-20 431 341)"/>
    <!-- Cuello / cabeza -->
    <rect x="456" y="306" width="12" height="14" fill="#c98b5f"/>
    <ellipse cx="462" cy="294" rx="19" ry="22" fill="#d9a06f"/>
    <!-- Cabello -->
    <path d="M443 292 Q440 268 462 268 Q486 268 482 292 Q478 280 468 282 Q456 276 443 292 Z" fill="#2b1b10"/>
    <!-- Cinta en el pelo -->
    <path d="M443 286 Q462 278 482 286" stroke="#ffffff" stroke-width="4" fill="none"/>
    <!-- Ojos y sonrisa -->
    <circle cx="455" cy="295" r="2.6" fill="#1a1a1a"/>
    <circle cx="470" cy="295" r="2.6" fill="#1a1a1a"/>
    <path d="M452 305 Q462 314 472 305" stroke="#7a2d1a" stroke-width="2.5" fill="#fff"/>
    <!-- Brazo hacia el volante -->
    <path d="M436 334 Q418 340 410 352" stroke="#ffffff" stroke-width="11" fill="none" stroke-linecap="round"/>
    <path d="M412 350 L404 360" stroke="#d9a06f" stroke-width="9" stroke-linecap="round"/>
    <!-- Volante -->
    <ellipse cx="408" cy="352" rx="7" ry="20" fill="none" stroke="#222" stroke-width="5"/>
  </g>
  <!-- Brazo saludando por la ventana -->
  <path d="M494 335 Q525 325 535 300" stroke="#ffffff" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M528 316 Q534 312 536 306" stroke="#d32f2f" stroke-width="4" fill="none"/>
  <path d="M536 298 L548 270" stroke="#d9a06f" stroke-width="10" stroke-linecap="round"/>
  <!-- Mano con pulgar arriba -->
  <ellipse cx="549" cy="266" rx="10" ry="9" fill="#d9a06f"/>
  <rect x="547" y="248" width="7" height="15" rx="3.5" fill="#d9a06f"/>
  <!-- Reflejo del vidrio -->
  <path d="M392 278 L420 278 L395 320 Z" fill="#ffffff" opacity="0.25"/>

  <!-- Número en la puerta -->
  <circle cx="420" cy="378" r="13" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/>
  <text x="420" y="383" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#1a1a1a">10</text>

  <!-- Ruedas -->
  <g>
    <circle cx="410" cy="545" r="102" fill="url(#tread)"/>
    <circle cx="410" cy="545" r="95" fill="url(#tire)"/>
    <circle cx="410" cy="545" r="55" fill="#e8a400" stroke="#a86f00" stroke-width="5"/>
    <circle cx="410" cy="545" r="22" fill="#555"/>
    <g fill="#333">
      <circle cx="410" cy="510" r="5"/><circle cx="445" cy="545" r="5"/>
      <circle cx="410" cy="580" r="5"/><circle cx="375" cy="545" r="5"/>
      <circle cx="435" cy="520" r="5"/><circle cx="385" cy="570" r="5"/>
      <circle cx="435" cy="570" r="5"/><circle cx="385" cy="520" r="5"/>
    </g>
  </g>
  <g>
    <circle cx="905" cy="545" r="102" fill="url(#tread)"/>
    <circle cx="905" cy="545" r="95" fill="url(#tire)"/>
    <circle cx="905" cy="545" r="55" fill="#e8a400" stroke="#a86f00" stroke-width="5"/>
    <circle cx="905" cy="545" r="22" fill="#555"/>
    <g fill="#333">
      <circle cx="905" cy="510" r="5"/><circle cx="940" cy="545" r="5"/>
      <circle cx="905" cy="580" r="5"/><circle cx="870" cy="545" r="5"/>
      <circle cx="930" cy="520" r="5"/><circle cx="880" cy="570" r="5"/>
      <circle cx="930" cy="570" r="5"/><circle cx="880" cy="520" r="5"/>
    </g>
  </g>

  <!-- Balón de fútbol rodando delante del camión -->
  <g transform="translate(150 610)">
    <circle r="38" fill="#ffffff" stroke="#1a1a1a" stroke-width="3"/>
    <polygon points="0,-12 11,-4 7,10 -7,10 -11,-4" fill="#1a1a1a"/>
    <polygon points="0,-38 9,-30 0,-22 -9,-30" fill="#1a1a1a"/>
    <polygon points="30,-18 36,-6 26,0 22,-12" fill="#1a1a1a"/>
    <polygon points="-30,-18 -22,-12 -26,0 -36,-6" fill="#1a1a1a"/>
    <polygon points="20,26 26,18 32,24 24,32" fill="#1a1a1a"/>
    <polygon points="-20,26 -24,32 -32,24 -26,18" fill="#1a1a1a"/>
    <g stroke="#1a1a1a" stroke-width="2">
      <line x1="0" y1="-12" x2="0" y2="-22"/><line x1="11" y1="-4" x2="22" y2="-12"/>
      <line x1="-11" y1="-4" x2="-22" y2="-12"/><line x1="7" y1="10" x2="20" y2="22"/>
      <line x1="-7" y1="10" x2="-20" y2="22"/>
    </g>
  </g>
  <!-- Líneas de movimiento del balón -->
  <g stroke="#ffffff" stroke-width="4" stroke-linecap="round" opacity="0.8">
    <line x1="200" y1="595" x2="235" y2="595"/>
    <line x1="205" y1="612" x2="250" y2="612"/>
    <line x1="200" y1="629" x2="232" y2="629"/>
  </g>

  <!-- Globo de diálogo -->
  <g>
    <path d="M190 190 Q190 140 260 140 L370 140 Q430 140 430 190 Q430 235 370 235 L320 235 L395 270 L290 235 L260 235 Q190 235 190 190 Z" fill="#ffffff" stroke="#1a1a1a" stroke-width="4"/>
    <text x="310" y="203" font-family="Arial Black, Arial, Helvetica, sans-serif" font-size="38" font-weight="900" text-anchor="middle" fill="#2e7d32">¡GOOOL!</text>
  </g>
</svg>
