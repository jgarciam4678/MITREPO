  <rect x="290" y="420" width="16" height="20" rx="3" fill="#fffbe0" stroke="#a86f00" stroke-width="2"/>
  <path d="M290 430 L200 405 L200 455 Z" fill="#fff7c2" opacity="0.35"/>

